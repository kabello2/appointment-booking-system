<div class="page-container">

  <div class="page-header">

    <h1>Services</h1>

    <button mat-raised-button color="primary" routerLink="/services/create">

      Create Service

    </button>

  </div>

  <mat-form-field appearance="outline" class="search-field">

    <mat-label>
      Search Services
    </mat-label>

    <input matInput placeholder="Search by code or name" (input)="filterServices($event)">

  </mat-form-field>

  <table mat-table [dataSource]="dataSource" MatSort class="mat-elevation-z2">

    <ng-container matColumnDef="serviceCode">

      <th mat-header-cell *matHeaderCellDef>
        Code
      </th>

      <td mat-cell *matCellDef="let service">
        {{ service.serviceCode }}
      </td>

    </ng-container>

    <ng-container matColumnDef="name">

      <th mat-header-cell *matHeaderCellDef>
        Name
      </th>

      <td mat-cell *matCellDef="let service">
        {{ service.name }}
      </td>

    </ng-container>

    <ng-container matColumnDef="durationMinutes">

      <th mat-header-cell *matHeaderCellDef>
        Duration
      </th>

      <td mat-cell *matCellDef="let service">
        {{ service.durationMinutes }} mins
      </td>

    </ng-container>

    <ng-container matColumnDef="active">

      <th mat-header-cell *matHeaderCellDef>
        Status
      </th>

      <td mat-cell *matCellDef="let service">

        @if (service.active) {

        <span class="status-active">
          Active
        </span>

        } @else {

        <span class="status-inactive">
          Inactive
        </span>

        }

      </td>

    </ng-container>

    <ng-container matColumnDef="actions">

      <th mat-header-cell *matHeaderCellDef>
        Actions
      </th>

      <td mat-cell *matCellDef="let service">

        <button mat-icon-button color="warn" (click)="deleteService(service)">

          <mat-icon>
            delete
          </mat-icon>

        </button>

      </td>

    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns">
    </tr>

    <tr mat-row *matRowDef="
        let row;
        columns: displayedColumns;
      ">
    </tr>

  </table>

</div>

<mat-paginator
  [pageSize]="10"
  [pageSizeOptions]="[
    5,
    10,
    20,
    50
  ]"
  showFirstLastButtons>
</mat-paginator>
