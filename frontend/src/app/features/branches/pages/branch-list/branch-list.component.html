<div class="page-header">

  <h1>
    Branches
  </h1>

  <button mat-raised-button color="primary" routerLink="/branches/create">

    Create Branch

  </button>

</div>

<mat-form-field appearance="outline" class="search-field">

  <mat-label>
    Search Branches
  </mat-label>

  <input matInput placeholder="Search branch" (input)="filterBranches($event)">

</mat-form-field>

<table mat-table [dataSource]="dataSource"matSort>

  <!-- Branch Code -->

  <ng-container matColumnDef="branchCode">

    <th mat-header-cell *matHeaderCellDef mat-sort-header>

      Code

    </th>

    <td mat-cell *matCellDef="let branch">

      {{ branch.branchCode }}

    </td>

  </ng-container>

  <!-- Name -->

  <ng-container matColumnDef="name">

    <th mat-header-cell *matHeaderCellDef mat-sort-header>

      Name

    </th>

    <td mat-cell *matCellDef="let branch">

      {{ branch.name }}

    </td>

  </ng-container>

  <!-- City -->

  <ng-container matColumnDef="city">

    <th mat-header-cell *matHeaderCellDef mat-sort-header>

      City

    </th>

    <td mat-cell *matCellDef="let branch">

      {{ branch.city }}

    </td>

  </ng-container>

  <!-- Contact -->

  <ng-container matColumnDef="contactNumber">

    <th mat-header-cell *matHeaderCellDef mat-sort-header>

      Contact

    </th>

    <td mat-cell *matCellDef="let branch">

      {{ branch.contactNumber }}

    </td>

  </ng-container>

  <!-- Status -->

  <ng-container matColumnDef="active">

    <th mat-header-cell *matHeaderCellDef mat-sort-header>

      Status

    </th>

    <td mat-cell *matCellDef="let branch">

      @if (branch.active) {

      Active

      } @else {

      Inactive

      }

    </td>

  </ng-container>

  <!-- Actions -->

  <ng-container matColumnDef="actions">

    <th mat-header-cell *matHeaderCellDef>

      Actions

    </th>

    <td mat-cell *matCellDef="let branch">

      <button mat-icon-button color="primary" [routerLink]="[
          '/branches',
          branch.id,
          'edit'
        ]">

        <mat-icon>
          edit
        </mat-icon>

      </button>

      <button mat-icon-button color="warn" (click)="deleteBranch(branch)">

        <mat-icon>
          delete
        </mat-icon>

      </button>

    </td>

  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns">
  </tr>

  <tr mat-row *matRowDef="
      let row;
      columns: displayedColumns
    ">
  </tr>

</table>

<mat-paginator
  [pageSize]="10"
  [pageSizeOptions]="[
    5,
    10,
    20,
    50
  ]"
  showFirstLastButtons>
</mat-paginator>
