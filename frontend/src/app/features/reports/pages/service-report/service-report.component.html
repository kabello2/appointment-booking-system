<div class="page-container">

  <h1>Service Popularity Report</h1>

  <table
    mat-table
    [dataSource]="services()"
    class="mat-elevation-z2">

    <ng-container matColumnDef="rank">

      <th mat-header-cell *matHeaderCellDef>
        Rank
      </th>

      <td mat-cell *matCellDef="let service; let i = index">

        {{ i + 1 }}

      </td>

    </ng-container>

    <ng-container matColumnDef="serviceCode">

      <th mat-header-cell *matHeaderCellDef>
        Service Code
      </th>

      <td mat-cell *matCellDef="let service">

        {{ service.serviceCode }}

      </td>

    </ng-container>

    <ng-container matColumnDef="serviceName">

      <th mat-header-cell *matHeaderCellDef>
        Service Name
      </th>

      <td mat-cell *matCellDef="let service">

        {{ service.serviceName }}

      </td>

    </ng-container>

    <ng-container matColumnDef="bookingCount">

      <th mat-header-cell *matHeaderCellDef>
        Booking Count
      </th>

      <td mat-cell *matCellDef="let service">

        {{ service.bookingCount }}

      </td>

    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>

    <tr
      mat-row
      *matRowDef="
        let row;
        columns: displayedColumns;
      ">
    </tr>

  </table>

</div>
