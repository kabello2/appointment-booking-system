<div class="page-container">

  <div class="page-header">

    <h1 class="page-title">
      Reporting Dashboard
    </h1>

  </div>

  @if (report(); as report) {

  <div class="dashboard-grid">

    <div class="
          dashboard-card
          dashboard-booked
        ">

      <div class="dashboard-title">
        Booked
      </div>

      <div class="dashboard-value">
        {{ report.booked }}
      </div>

    </div>

    <div class="
          dashboard-card
          dashboard-confirmed
        ">

      <div class="dashboard-title">
        Confirmed
      </div>

      <div class="dashboard-value">
        {{ report.confirmed }}
      </div>

    </div>

    <div class="
          dashboard-card
          dashboard-completed
        ">

      <div class="dashboard-title">
        Completed
      </div>

      <div class="dashboard-value">
        {{ report.completed }}
      </div>

    </div>

    <div class="
          dashboard-card
          dashboard-cancelled
        ">

      <div class="dashboard-title">
        Cancelled
      </div>

      <div class="dashboard-value">
        {{ report.cancelled }}
      </div>

    </div>

    <div class="
          dashboard-card
          dashboard-rescheduled
        ">

      <div class="dashboard-title">
        Rescheduled
      </div>

      <div class="dashboard-value">
        {{ report.rescheduled }}
      </div>

    </div>

  </div>

  }

</div>
