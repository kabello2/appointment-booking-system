<div class="page-container">

  <h1>Branch Performance Report</h1>

  <table mat-table [dataSource]="branches()" class="mat-elevation-z2">

    <ng-container matColumnDef="branchCode">

      <th mat-header-cell *matHeaderCellDef>
        Branch Code
      </th>

      <td mat-cell *matCellDef="let branch">

        {{ branch.branchCode }}

      </td>

    </ng-container>

    <ng-container matColumnDef="branchName">

      <th mat-header-cell *matHeaderCellDef>
        Branch Name
      </th>

      <td mat-cell *matCellDef="let branch">

        {{ branch.branchName }}

      </td>

    </ng-container>

    <ng-container matColumnDef="appointmentCount">

      <th mat-header-cell *matHeaderCellDef>
        Appointment Count
      </th>

      <td mat-cell *matCellDef="let branch">

        {{ branch.appointmentCount }}

      </td>

    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns">
    </tr>

    <tr mat-row *matRowDef="
        let row;
        columns: displayedColumns;
      ">
    </tr>

  </table>

</div>
