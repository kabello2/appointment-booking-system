<div class="page-container">

  <div class="page-header">

    <h1>Users</h1>

    <button
      mat-raised-button
      color="primary"
      routerLink="/users/create">

      Create User

    </button>

  </div>
  <mat-form-field
    appearance="outline"
    class="search-field">

    <mat-label>
      Search Users
    </mat-label>

    <input
      matInput
      placeholder="Search by name or email"
      (input)="filterUsers($event)">

  </mat-form-field>

  @if (loading()) {

  <app-loading-spinner />

}

  <table
    mat-table
    [dataSource]="users()"
    class="mat-elevation-z2">

    <ng-container matColumnDef="firstName">

      <th mat-header-cell *matHeaderCellDef>
        First Name
      </th>

      <td mat-cell *matCellDef="let user">
        {{ user.firstName }}
      </td>

    </ng-container>

    <ng-container matColumnDef="lastName">

      <th mat-header-cell *matHeaderCellDef>
        Last Name
      </th>

      <td mat-cell *matCellDef="let user">
        {{ user.lastName }}
      </td>

    </ng-container>

    <ng-container matColumnDef="email">

      <th mat-header-cell *matHeaderCellDef>
        Email
      </th>

      <td mat-cell *matCellDef="let user">
        {{ user.email }}
      </td>

    </ng-container>

    <ng-container matColumnDef="role">

      <th mat-header-cell *matHeaderCellDef>
        Role
      </th>

      <td mat-cell *matCellDef="let user">
        {{ user.role | roleDisplay }}
      </td>

    </ng-container>

    <ng-container matColumnDef="enabled">

      <th mat-header-cell *matHeaderCellDef>
        Status
      </th>

      <td mat-cell *matCellDef="let user">

        @if (user.enabled) {

          <span class="status-active">
            Active
          </span>

        } @else {

          <span class="status-disabled">
            Disabled
          </span>

        }

      </td>

    </ng-container>

    <ng-container matColumnDef="actions">

      <th mat-header-cell *matHeaderCellDef>
        Actions
      </th>

      <td mat-cell *matCellDef="let user">

        <button
          mat-icon-button
          color="primary"
          [routerLink]="[
            '/users',
            user.id,
            'edit'
          ]">

          <mat-icon>
            edit
          </mat-icon>

        </button>

        <button
          mat-icon-button
          color="warn"
          (click)="toggleStatus(user)">

          <mat-icon>

            {{
              user.enabled
                ? 'block'
                : 'check_circle'
            }}

          </mat-icon>

        </button>

      </td>

    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>

    <tr
      mat-row
      *matRowDef="
        let row;
        columns: displayedColumns;
      ">
    </tr>

  </table>

</div>
