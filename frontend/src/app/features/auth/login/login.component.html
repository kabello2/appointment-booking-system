<mat-card class="login-card">

  <h2>Sign In</h2>

  <form [formGroup]="loginForm">

    <mat-form-field appearance="outline">

      <mat-label>Email</mat-label>

      <input
        matInput
        formControlName="email">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>Password</mat-label>

      <input
        type="password"
        matInput
        formControlName="password">

    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      (click)="login()">

      Login

    </button>

  </form>

</mat-card>
