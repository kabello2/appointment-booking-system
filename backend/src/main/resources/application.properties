spring.application.name=appointment-booking

info.application.name=Appointment Booking System
info.application.version=1.0.0
info.application.description=Branch Appointment Booking Platform

server.port=8081

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/appointment_booking
spring.datasource.username=postgres
spring.datasource.password=DataStorage

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true

logging.level.org.springframework.security=DEBUG

cors.allowed-origins=http://localhost:4200

JWT_SECRET_KEY=VGhpc0lzQVN1cGVyTG9uZ1NlY3JldEtleUZvckpXVFRlc3RpbmdQdXJwb3Nlc09ubHk
security.jwt.secret-key=${JWT_SECRET_KEY}

appointment.business-hours.start=08:00
appointment.business-hours.end=17:00
appointment.slot-duration-minutes=30

notification.dispatcher.fixed-delay-ms=60000
notification.batch-size=100

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

security.jwt.access-token-expiration=900000
security.jwt.refresh-token-expiration=604800000

security.login.max-failed-attempts=5
security.login.lock-duration-minutes=30

security.rate-limit.login.capacity=10
security.rate-limit.login.duration-minutes=15

security.rate-limit.registration.capacity=5
security.rate-limit.registration.duration-hours=1

bootstrap.admin.enabled=true
bootstrap.admin.email=admin.booking@mail.com
bootstrap.admin.password=Password@2026